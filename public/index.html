<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6IEH_G7RusV4wBneiSiAhksYsVydKzJyVZ6SZUQP5vZgQ"; 
    const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    // Dữ liệu tổng hợp toàn bộ các tháng
    const allMonthsData = {
        'T05': { monthName: 'Tháng 05/2026', kpiDone: '3 / 3 Báo Cáo', kpiPending: '0 Báo Cáo', pendingColor: 'text-emerald-600', rows: [{ m: 'T05', name: '1. Báo Cáo Đổi Trả Giao Dịch', date: '10/05', status: '✅ Đã làm', res: 'Top 1: SKK Thái Hà (18 đơn)' }, { m: 'T05', name: '2. Báo Cáo Đánh Giá Dịch Vụ', date: '12/05', status: '✅ Đã làm', res: 'SKK Hàm Nghi đạt 100%' }, { m: 'T05', name: '3. Báo Cáo Trưng Bày CTKM', date: '15/05', status: '✅ Đã làm', res: 'Chấm điểm 22/22 ST' }] },
        'T06': { monthName: 'Tháng 06/2026', kpiDone: '3 / 3 Báo Cáo', kpiPending: '0 Báo Cáo', pendingColor: 'text-emerald-600', rows: [{ m: 'T06', name: '1. Báo Cáo Đổi Trả Giao Dịch', date: '10/06', status: '✅ Đã làm', res: 'Top 1: SKK Linh Đàm (21 đơn)' }, { m: 'T06', name: '2. Báo Cáo Đánh Giá Dịch Vụ', date: '12/06', status: '✅ Đã làm', res: 'Vi phạm vệ sinh: 3 ST' }, { m: 'T06', name: '3. Báo Cáo Trưng Bày CTKM', date: '15/06', status: '✅ Đã làm', res: 'Hoàn thành 22/22 ST' }] },
        'T07': { monthName: 'Tháng 07/2026', kpiDone: '3 / 3 Báo Cáo', kpiPending: '0 Báo Cáo', pendingColor: 'text-emerald-600', rows: [{ m: 'T07', name: '1. Báo Cáo Đổi Trả Giao Dịch', date: '10/07', status: '✅ Đã làm', res: 'Top 1: SKK Trần Đăng Ninh (18 đơn)' }, { m: 'T07', name: '2. Báo Cáo Đánh Giá Dịch Vụ', date: '12/07', status: '✅ Đã làm', res: 'Tỷ lệ phục vụ tốt 95%' }, { m: 'T07', name: '3. Báo Cáo Trưng Bày CTKM', date: '15/07', status: '✅ Đã làm', res: 'CTKM Tháng 7 hoàn thành' }] },
        'T08': { monthName: 'Tháng 08/2026', kpiDone: '2 / 3 Báo Cáo', kpiPending: '1 Báo Cáo', pendingColor: 'text-rose-600', rows: [{ m: 'T08', name: '1. Báo Cáo Đổi Trả Giao Dịch', date: '10/08', status: '✅ Đã làm', res: 'Top 1: SKK Trần Đăng Ninh (23 đơn)' }, { m: 'T08', name: '2. Báo Cáo Đánh Giá Dịch Vụ', date: '12/08', status: '✅ Đã làm', res: '17 lỗi tem giá' }, { m: 'T08', name: '3. Báo Cáo Trưng Bày CTKM', date: '15/08', status: '⏳ Chưa làm', res: 'Chưa tải file dữ liệu' }] }
    };

    let currentSelectedMonth = 'T08';
    let currentBotName = "QC AI Assistant";

    function selectMonth(monthKey) {
        currentSelectedMonth = monthKey;
        const data = allMonthsData[monthKey];

        document.querySelectorAll('.month-btn').forEach(btn => btn.className = 'month-btn px-4 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition');
        const activeTab = document.getElementById(`tab-${monthKey}`);
        if(activeTab) activeTab.className = 'month-btn px-4 py-2 rounded-lg text-xs font-bold bg-sakuko-blue text-white shadow';

        document.getElementById('kpi-month').innerText = data.monthName;
        document.getElementById('kpi-done').innerText = data.kpiDone;
        document.getElementById('kpi-pending').innerText = data.kpiPending;
        document.getElementById('kpi-pending').className = `text-xl font-black mt-1 ${data.pendingColor}`;
        document.getElementById('table-subtitle').innerText = `Dữ liệu ${data.monthName}`;

        const tbody = document.getElementById('report-table-body');
        tbody.innerHTML = '';
        data.rows.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="py-3 px-4 font-bold">${row.m}</td>
                <td class="py-3 px-4 font-bold text-slate-900">${row.name}</td>
                <td class="py-3 px-4 text-slate-500">${row.date}</td>
                <td class="py-3 px-4"><span class="bg-slate-100 px-2 py-1 rounded text-[11px] font-bold">${row.status}</span></td>
                <td class="py-3 px-4">${row.res}</td>
                <td class="py-3 px-4 text-center"><button class="bg-sakuko-blue text-white px-3 py-1 rounded text-[11px]">Xem</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('ai-screen-tag').innerText = data.monthName;
    }

    // ================= XỬ LÝ LỆNH THÔNG MINH BẰNG GEMINI AI =================
    async function sendMessage() {
        const input = document.getElementById('ai-input');
        const text = input.value.trim();
        if (!text) return;

        appendUserMessage(text);
        input.value = '';

        const loadingId = appendLoadingMessage();

        // 1. Thực thi hành động trên Web trước (Đổi tháng, Đổi tên, Gửi mail)
        autoExecuteWebAction(text);

        try {
            // 2. Tạo System Prompt thông minh cung cấp toàn bộ ngữ cảnh dữ liệu
            const systemPrompt = `
You are an intelligent AI assistant named "${currentBotName}". You are supporting chị Nguyễn Thị Minh Hà (QC Admin at Sakuko).
Style: Speak polite, natural, clear Vietnamese. Use markdown bullet points and bold texts for key metrics.

[CURRENT SYSTEM CONTEXT]
- Selected Month on Screen: ${allMonthsData[currentSelectedMonth].monthName}
- Current Screen Data: ${JSON.stringify(allMonthsData[currentSelectedMonth])}
- Full Historical Data (T5 to T8): ${JSON.stringify(allMonthsData)}

[INSTRUCTIONS FOR RESPONDING]
1. If the user asks to compare months (e.g., T8 vs T7), analyze the historical data provided and calculate differences directly.
2. If the user asks to change bot name or navigate tabs, acknowledge that the web interface has been updated automatically.
3. Be concise, actionable, and focus on QC insights (returns, service rating, store violations).
`;

            const response = await fetch(GEMINI_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${systemPrompt}\n\nUser Message: ${text}` }] }]
                })
            });

            const data = await response.json();
            removeLoadingMessage(loadingId);

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                appendAiMessage(data.candidates[0].content.parts[0].text);
            } else {
                appendAiMessage("Lỗi xử lý phản hồi từ Gemini API.");
            }
        } catch (err) {
            removeLoadingMessage(loadingId);
            appendAiMessage("❌ Lỗi kết nối API. Chị hãy kiểm tra lại kết nối mạng!");
        }
    }

    function autoExecuteWebAction(promptText) {
        const lower = promptText.toLowerCase();
        
        // Nhận diện lệnh đổi tên linh hoạt
        if (lower.includes("đổi tên") || lower.includes("trợ lý của") || lower.includes("đổi thành")) {
            if (lower.includes("minh hà") || lower.includes("chị hà")) {
                currentBotName = "Trợ lý của Minh Hà";
            } else {
                currentBotName = "QC AI Assistant";
            }
            const headerEl = document.getElementById('bot-header-name');
            if (headerEl) headerEl.innerText = currentBotName;
            document.querySelectorAll('.bot-display-name').forEach(el => el.innerText = currentBotName);
        }

        // Nhận diện chuyển tháng
        if (lower.includes("tháng 5") || lower.includes("tháng 05") || lower.includes("t05")) selectMonth('T05');
        else if (lower.includes("tháng 6") || lower.includes("tháng 06") || lower.includes("t06")) selectMonth('T06');
        else if (lower.includes("tháng 7") || lower.includes("tháng 07") || lower.includes("t07")) selectMonth('T07');
        else if (lower.includes("tháng 8") || lower.includes("tháng 08") || lower.includes("t08")) selectMonth('T08');

        // Nhận diện gửi mail
        if (lower.includes("gửi mail") || lower.includes("gửi báo cáo")) triggerAutoMail();
    }

    function appendUserMessage(msg) {
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div class="flex gap-2.5 justify-end"><div class="bg-sakuko-blue text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[85%]"><p class="font-bold text-sky-300 text-[10px]">Chị Hà</p><p>${msg}</p></div></div>`;
        win.scrollTop = win.scrollHeight;
    }

    function appendAiMessage(msg) {
        const win = document.getElementById('chat-window');
        const formatted = msg.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        win.innerHTML += `<div class="flex gap-2.5"><div class="w-7 h-7 rounded-full bg-sakuko-orange text-white flex items-center justify-center text-xs flex-shrink-0 shadow"><i class="fa-solid fa-robot"></i></div><div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-xs text-slate-800 shadow-sm max-w-[85%]"><p class="font-bold text-sakuko-orange text-[11px] bot-display-name">${currentBotName}</p><p>${formatted}</p></div></div>`;
        win.scrollTop = win.scrollHeight;
    }

    function appendLoadingMessage() {
        const win = document.getElementById('chat-window');
        const id = 'loading-' + Date.now();
        win.innerHTML += `<div id="${id}" class="flex gap-2.5"><div class="w-7 h-7 rounded-full bg-sakuko-orange text-white flex items-center justify-center text-xs flex-shrink-0"><i class="fa-solid fa-robot"></i></div><div class="bg-white border border-slate-200 p-3 rounded-2xl text-xs text-slate-400 italic">AI đang phân tích...</div></div>`;
        win.scrollTop = win.scrollHeight;
        return id;
    }

    function removeLoadingMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function toggleAiBot() { document.getElementById('ai-bot-sidebar').classList.toggle('hidden'); }
    function triggerAutoMail() { alert("📧 [Auto Mail] Đã gửi báo cáo tổng hợp cho Sếp!"); }

    function initCharts() {
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: { labels: ['T5', 'T6', 'T7', 'T8'], datasets: [{ label: 'Số Lỗi', data: [142, 128, 114, 90], borderColor: '#2563eb', fill: false }] }
        });
        new Chart(document.getElementById('storeChart'), {
            type: 'bar',
            data: { labels: ['Trần Đăng Ninh', 'Linh Đàm', 'Thái Hà', 'Hàm Nghi'], datasets: [{ label: 'Lỗi T8', data: [23, 15, 12, 9], backgroundColor: '#dc2626' }] }
        });
    }

    window.onload = function() { selectMonth('T08'); initCharts(); };
</script>
